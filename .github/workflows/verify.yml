name: Java build and smoke tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: javac SmartCampusResourceManagement.java
      - run: |
          java SmartCampusResourceManagement > output.txt
          grep -q 'Total consumption:' output.txt
          grep -q 'All campus resources processed successfully' output.txt
